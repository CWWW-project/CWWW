version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-cwww-local

    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: cwww_db
      POSTGRES_USER: cwww
      POSTGRES_PASSWORD: cwww1234

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cwww-local

    ports:
      - "6379:6379"

volumes:
  postgres-data:

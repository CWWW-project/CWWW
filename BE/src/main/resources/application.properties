spring.application.name=cwww
server.port=8080

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000
jwt.refresh-expiration=1209600000

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Storage (base-url은 환경별 프로파일에서 설정)
storage.local.path=uploads
storage.local.base-url=${STORAGE_BASE_URL:http://localhost:8080/uploads}

toss.secret-key=test_sk_d46qopOB89dgBwJ0gYM7rZmM75y0

# BGM
jamendo.client-id=${JAMENDO_CLIENT_ID}
jamendo.api-url=https://api.jamendo.com/v3.0/tracks/

# OAuth2 - Google (Spring Security 내장 지원)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# OAuth2 - GitHub (Spring Security 내장 지원)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# OAuth2 FE 리다이렉트 URI (환경별 필수 설정)
oauth2.redirect-uri=${OAUTH2_REDIRECT_URI}
oauth2.login-uri=${OAUTH2_LOGIN_URI}
# DataSource - H2 인메모리
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway - PostgreSQL 전용 SQL이 H2에서 동작하지 않으므로 비활성화
spring.flyway.enabled=false

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret=test-secret-key-for-testing-minimum-32-chars!!
jwt.expiration=1800000
jwt.refresh-expiration=1209600000

# Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Redis (lazy connect - 실제 연결 안 함)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Storage
storage.local.path=uploads
storage.local.base-url=http://localhost:8080/uploads

# Toss
toss.secret-key=test_toss_secret_key

# BGM
jamendo.client-id=test-client-id
jamendo.api-url=https://api.jamendo.com/v3.0/tracks/

# OAuth2 - Google
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# OAuth2 - GitHub
spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# OAuth2 redirect
oauth2.redirect-uri=http://localhost:3000/oauth2/callback
oauth2.login-uri=http://localhost:3000/login
